<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic Chess</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main>
        <section id="main-menu">
            <img src="./assets/ui/logo.png" alt="Gothic Chess" class="menu-logo">
            <nav class="menu-buttons" aria-label="Main menu">
                <button class="menu-button" id="play-computer" type="button">
                    <img src="./assets/ui/icons/knight.png" alt="" class="button-icon">
                    <span>Play vs Computer</span>
                </button>
                <button class="menu-button" id="local-pvp" type="button">
                    <img src="./assets/ui/icons/local-pvp.png" alt="" class="button-icon">
                    <span>Local PvP</span>
                </button>

                <button class="menu-button" id="settings" type="button">
                    <img src="./assets/ui/icons/settings.png" alt="" class="button-icon">
                    <span>Settings</span>
                </button>

                <button class="menu-button" id="about" type="button">
                    <img src="./assets/ui/icons/about.png" class="button-icon">
                    <span>About</span>
                </button>
            </nav>
        </section>
        <section id="game-screen" class="hidden">
            <div class="game-sidebar">
                <div class="game-banner">
                    <div class="game-banner-shade"></div>
                    <img src="./assets/ui/game-logo-banner.png" alt="" class="game-logo-banner">
                    <div class="game-banner-title">
                        <span>Gothic</span>
                        <span>Chess</span>
                        <img src="./assets/ui/icons/game-crown.png" alt="" class="game-crown">
                    </div>
                </div>

                <div class="game-info-panel">
                    <div class="game-info-shade"></div>
                    <img src="./assets/ui/game-info-frame.png" alt="" class="game-info-frame">
                </div>
            </div>
        </section>
    </main>
    <div id="screen-fade"></div>
    <section id="loading-screen" class="hidden">
        <div class="loading-content">
            <div class="loading-characters">
                <img src="./assets/characters/loading-characters.png" alt="Dark King and Light Queen"
                    class="loading-image">
            </div>

            <p class="loading-quote">
                Two sides. One destiny.
            </p>
        </div>
    </section>

    <script type="module" src="./js/main.js"></script>
</body>

</html>
